<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QUEMASSTEDA · Vuelvo enseguida</title>
<style>
:root{--orange:#ff6a00;--orange2:#ff9b3d;--bg:#08090b;--panel:#111319;--muted:#b6bac4}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:#fff;font-family:Inter,Arial,Helvetica,sans-serif}
body:before,body:after{content:"";position:fixed;inset:-25%;pointer-events:none;background:
linear-gradient(115deg,transparent 0 46%,rgba(255,106,0,.08) 46.2% 46.7%,transparent 47% 100%),
linear-gradient(295deg,transparent 0 55%,rgba(255,106,0,.05) 55.2% 55.8%,transparent 56% 100%);animation:drift 18s linear infinite}
body:after{transform:scale(1.3) rotate(180deg);opacity:.5;animation-duration:28s}
@keyframes drift{to{transform:translate3d(5%,-3%,0)}}
.stage{height:100vh;width:100vw;padding:4.2vh 5vw;display:grid;grid-template-rows:auto 1fr;gap:2.8vh}
.header{position:relative;background:linear-gradient(180deg,#15171d,#0d0f13);border:1px solid rgba(255,255,255,.07);border-radius:24px;padding:2.25vh 2.6vw;box-shadow:0 18px 60px rgba(0,0,0,.38);overflow:hidden}
.header:before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:linear-gradient(#ff9b3d,#ff5700)}
.kicker{font-size:clamp(14px,1.05vw,22px);letter-spacing:.24em;text-transform:uppercase;color:var(--orange2);font-weight:800;margin-bottom:.45vh}
h1{margin:0;font-size:clamp(42px,5.5vw,104px);line-height:.95;letter-spacing:-.05em;font-weight:950}
.sub{margin-top:1vh;color:var(--muted);font-size:clamp(15px,1.3vw,26px)}
.playerWrap{min-height:0;position:relative;border-radius:28px;overflow:hidden;background:#020203;border:1px solid rgba(255,255,255,.08);box-shadow:0 28px 85px rgba(0,0,0,.58)}
iframe{width:100%;height:100%;border:0;background:#000;display:block}
.bottom{position:absolute;z-index:5;left:0;right:0;bottom:0;padding:5.5vh 2.4vw 2vh;background:linear-gradient(transparent,rgba(0,0,0,.9));pointer-events:none}
.clipTitle{font-size:clamp(15px,1.45vw,28px);font-weight:800;text-shadow:0 2px 12px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;justify-content:space-between;gap:20px;color:#d3d5db;margin-top:.4vh;font-size:clamp(12px,.95vw,19px)}
.progress{height:5px;background:rgba(255,255,255,.17);margin-top:1.2vh;border-radius:10px;overflow:hidden}
.bar{height:100%;width:0;background:linear-gradient(90deg,var(--orange),var(--orange2))}
.badge{position:absolute;right:1.6vw;top:1.6vh;z-index:6;background:rgba(9,10,12,.78);border:1px solid rgba(255,255,255,.09);padding:8px 12px;border-radius:999px;font-size:12px;color:#d9dce2}
.status{position:absolute;z-index:10;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at center,#151820,#07080b 70%);text-align:center;padding:40px}
.card{width:min(720px,94vw);padding:40px;border:1px solid rgba(255,255,255,.08);border-radius:24px;background:rgba(15,17,22,.96);box-shadow:0 24px 80px rgba(0,0,0,.4)}
.logo{font-size:52px}.card h2{font-size:30px;margin:8px 0 12px}.card p{color:#c7cbd3;line-height:1.55}
input{width:100%;padding:14px 15px;margin:12px 0;border-radius:11px;border:1px solid #333844;background:#090a0d;color:#fff;font-size:15px;outline:none}
button{width:100%;padding:15px 18px;border:0;border-radius:11px;background:linear-gradient(90deg,#ff5700,#ff8c24);color:#fff;font-weight:900;font-size:15px;cursor:pointer}
button.secondary{margin-top:10px;background:#292b31}
.small{font-size:12px!important;color:#9297a1!important}.error{color:#ff8e8e!important;white-space:pre-wrap}.hidden{display:none!important}
</style>
</head>
<body>
<div class="stage">
  <section class="header">
    <div class="kicker">QUEMASSTEDA · TWITCH</div>
    <h1>VUELVO ENSEGUIDA</h1>
    <div class="sub">Mientras tanto, disfruta de algunos clips del canal ✦</div>
  </section>

  <section class="playerWrap">
    <iframe id="player" allow="autoplay; fullscreen" allowfullscreen></iframe>
    <div class="badge" id="badge">Preparando Twitch…</div>
    <div class="bottom">
      <div class="clipTitle" id="clipTitle">Cargando clip…</div>
      <div class="meta"><span id="clipMeta">@quemassteda</span><span id="counter"></span></div>
      <div class="progress"><div class="bar" id="bar"></div></div>
    </div>

    <div class="status" id="status">
      <div class="card">
        <div class="logo">✦</div>
        <h2 id="statusTitle">Configurar Twitch</h2>
        <p id="statusText">Pega una sola vez el <b>Client ID</b> de tu aplicación de Twitch.</p>

        <div id="setup">
          <input id="clientId" placeholder="Client ID de Twitch">
          <button id="saveClient">GUARDAR CLIENT ID</button>
          <p class="small">El Client ID es público. No pongas aquí ningún Client Secret.</p>
        </div>

        <div id="loginBox" class="hidden">
          <button id="connect">CONECTAR CON TWITCH</button>
          <button id="changeClient" class="secondary">CAMBIAR CLIENT ID</button>
        </div>

        <p class="error" id="err"></p>
      </div>
    </div>
  </section>
</div>

<script>
const CHANNEL = "quemassteda";
const KEY_CLIENT = "qst_meld_client_id";
const KEY_TOKEN = "qst_meld_oauth_token";

const $ = q => document.querySelector(q);
const player = $("#player"), status = $("#status"), badge = $("#badge");
const titleEl = $("#clipTitle"), metaEl = $("#clipMeta"), counterEl = $("#counter"), bar = $("#bar"), err = $("#err");

let clips=[], queue=[], pos=0, timer=null, tick=null, startedAt=0, clipDuration=0;

function shuffle(a){
  a=[...a];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a;
}
function cleanUrl(){
  history.replaceState(null,"",location.pathname+location.search);
}
function randomState(){
  const a=new Uint32Array(4); crypto.getRandomValues(a);
  return Array.from(a,x=>x.toString(16)).join("");
}
function redirectUri(){
  return location.origin + location.pathname;
}
function parseOAuth(){
  const h=new URLSearchParams(location.hash.replace(/^#/,""));
  const token=h.get("access_token");
  const state=h.get("state");
  if(token){
    const expected=sessionStorage.getItem("qst_oauth_state");
    if(expected && state!==expected) throw new Error("La respuesta de Twitch no coincide con esta sesión.");
    localStorage.setItem(KEY_TOKEN,token);
    sessionStorage.removeItem("qst_oauth_state");
    cleanUrl();
    return token;
  }
  const q=new URLSearchParams(location.search);
  if(q.get("error")) throw new Error(q.get("error_description") || q.get("error"));
  return localStorage.getItem(KEY_TOKEN);
}
async function validateToken(token){
  const r=await fetch("https://id.twitch.tv/oauth2/validate",{headers:{Authorization:"OAuth "+token}});
  if(!r.ok) return false;
  const j=await r.json();
  const clientId=localStorage.getItem(KEY_CLIENT);
  return !!j.client_id && j.client_id===clientId;
}
async function helix(path,token){
  const clientId=localStorage.getItem(KEY_CLIENT);
  const r=await fetch("https://api.twitch.tv/helix/"+path,{
    headers:{"Client-Id":clientId,"Authorization":"Bearer "+token}
  });
  const j=await r.json();
  if(!r.ok) throw new Error(j.message || ("Twitch API HTTP "+r.status));
  return j;
}
async function getChannelId(token){
  const j=await helix("users?login="+encodeURIComponent(CHANNEL),token);
  if(!j.data?.length) throw new Error("No encuentro el canal "+CHANNEL+".");
  return j.data[0].id;
}
async function getClips(token,id){
  const j=await helix("clips?broadcaster_id="+encodeURIComponent(id)+"&first=100",token);
  if(!j.data?.length) throw new Error("Twitch no ha devuelto clips para "+CHANNEL+".");
  return j.data;
}
function embedUrl(clip){
  const p=new URLSearchParams({
    clip:clip.id,
    parent:location.hostname,
    autoplay:"true",
    muted:"false"
  });
  return "https://clips.twitch.tv/embed?"+p.toString();
}
function startProgress(seconds){
  clearInterval(tick);
  startedAt=performance.now();
  clipDuration=Math.max(1,seconds||15);
  tick=setInterval(()=>{
    const elapsed=(performance.now()-startedAt)/1000;
    bar.style.width=Math.min(100,elapsed/clipDuration*100)+"%";
  },100);
}
function playNext(){
  clearTimeout(timer);
  if(!queue.length) return;
  if(pos>=queue.length){queue=shuffle(clips);pos=0}
  const clip=queue[pos++];
  titleEl.textContent=clip.title || "Clip de quemassteda";
  metaEl.textContent="@"+CHANNEL+" · "+Number(clip.view_count||0).toLocaleString("es-ES")+" visualizaciones";
  counterEl.textContent=pos+" / "+queue.length;
  badge.textContent="Clip oficial de Twitch";
  player.src=embedUrl(clip);

  const seconds=Math.max(3,Number(clip.duration||15));
  startProgress(seconds);
  // Pequeño margen para carga/transición del iframe.
  timer=setTimeout(playNext,(seconds+1.2)*1000);
}
async function begin(token){
  status.classList.remove("hidden");
  $("#setup").classList.add("hidden");
  $("#loginBox").classList.add("hidden");
  $("#statusTitle").textContent="Cargando tus clips…";
  $("#statusText").textContent="Conectando con la API oficial de Twitch.";
  err.textContent="";
  badge.textContent="Consultando Twitch…";

  const valid=await validateToken(token);
  if(!valid){
    localStorage.removeItem(KEY_TOKEN);
    showLogin();
    return;
  }

  const id=await getChannelId(token);
  clips=await getClips(token,id);
  queue=shuffle(clips);
  status.classList.add("hidden");
  badge.textContent=clips.length+" clips cargados";
  playNext();
}
function showSetup(){
  status.classList.remove("hidden");
  $("#statusTitle").textContent="Configurar Twitch";
  $("#statusText").innerHTML='Pega una sola vez el <b>Client ID</b> de tu aplicación de Twitch.';
  $("#setup").classList.remove("hidden");
  $("#loginBox").classList.add("hidden");
  $("#clientId").value=localStorage.getItem(KEY_CLIENT)||"";
}
function showLogin(){
  status.classList.remove("hidden");
  $("#statusTitle").textContent="Conectar con Twitch";
  $("#statusText").textContent="Autoriza el overlay y después los clips se cargarán automáticamente.";
  $("#setup").classList.add("hidden");
  $("#loginBox").classList.remove("hidden");
  err.textContent="";
}
function connect(){
  const clientId=localStorage.getItem(KEY_CLIENT);
  if(!clientId){showSetup();return}
  const state=randomState();
  sessionStorage.setItem("qst_oauth_state",state);
  const p=new URLSearchParams({
    response_type:"token",
    client_id:clientId,
    redirect_uri:redirectUri(),
    scope:"",
    state
  });
  location.href="https://id.twitch.tv/oauth2/authorize?"+p.toString();
}
function fail(e){
  console.error(e);
  status.classList.remove("hidden");
  $("#statusTitle").textContent="No he podido cargar los clips";
  $("#statusText").textContent="Twitch ha devuelto un error.";
  err.textContent=String(e?.message||e);
  $("#loginBox").classList.remove("hidden");
}

$("#saveClient").onclick=()=>{
  const v=$("#clientId").value.trim();
  if(!v){err.textContent="Pega el Client ID.";return}
  localStorage.setItem(KEY_CLIENT,v);
  localStorage.removeItem(KEY_TOKEN);
  showLogin();
};
$("#connect").onclick=connect;
$("#changeClient").onclick=()=>{
  localStorage.removeItem(KEY_TOKEN);
  showSetup();
};

(async()=>{
  try{
    if(!localStorage.getItem(KEY_CLIENT)){showSetup();return}
    const token=parseOAuth();
    if(!token){showLogin();return}
    await begin(token);
  }catch(e){fail(e)}
})();
</script>
</body>
</html>
