<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vuelvo enseguida</title>
<style>
:root{
  --bg:#090a0d;
  --panel:#17191e;
  --orange:#ff6a00;
  --orange2:#ff922f;
}
*{box-sizing:border-box}
html,body{
  width:100%;height:100%;margin:0;overflow:hidden;
  background:var(--bg);color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}
body{
  background:
    radial-gradient(circle at 50% 30%,rgba(255,106,0,.045),transparent 38%),
    linear-gradient(180deg,#0b0c10,#08090b);
}
body:before,body:after{
  content:"";position:fixed;inset:-25%;pointer-events:none;
}
body:before{
  opacity:.65;
  background:
    linear-gradient(110deg,transparent 0 47%,rgba(255,106,0,.08) 47.25% 47.65%,transparent 47.9%),
    linear-gradient(290deg,transparent 0 58%,rgba(255,106,0,.04) 58.25% 58.55%,transparent 58.8%);
  animation:bgmove 22s linear infinite;
}
body:after{
  opacity:.35;
  background:linear-gradient(68deg,transparent 0 49%,rgba(255,106,0,.08) 49.25% 49.5%,transparent 49.8%);
  animation:bgmove2 29s linear infinite;
}
@keyframes bgmove{to{transform:translate3d(5%,-3%,0)}}
@keyframes bgmove2{to{transform:translate3d(-4%,3%,0)}}

.screen{
  height:100vh;width:100vw;
  padding:4vh 5.2vw 5vh;
  display:flex;flex-direction:column;
  align-items:center;
  gap:2.4vh;
}
.header{
  width:min(1180px,82vw);
  min-height:14.5vh;
  border:1px solid rgba(255,255,255,.09);
  border-radius:5px;
  background:linear-gradient(180deg,#1a1c21,#111318);
  box-shadow:0 18px 60px rgba(0,0,0,.38);
  position:relative;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:1.5vh 3vw 1.2vh;
}
.header:before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  background:linear-gradient(var(--orange2),var(--orange));
  box-shadow:0 0 20px rgba(255,106,0,.35);
}
.header:after{
  content:"";position:absolute;left:0;bottom:-1px;width:18%;height:2px;
  background:var(--orange);
}
.title{
  margin:0;
  font-size:clamp(48px,5.35vw,104px);
  line-height:.93;
  font-weight:950;
  letter-spacing:-.04em;
  text-transform:uppercase;
  text-align:center;
}
.subtitle{
  margin-top:.7vh;
  font-size:clamp(13px,1.15vw,23px);
  font-weight:800;
  color:#e1e2e6;
  text-transform:uppercase;
  letter-spacing:.02em;
  text-align:center;
}
.clip-frame{
  flex:1;
  min-height:0;
  width:min(1280px,88vw);
  position:relative;
  padding:3px;
  border-radius:6px;
  background:linear-gradient(135deg,var(--orange),rgba(255,106,0,.25) 35%,rgba(255,255,255,.16) 60%,var(--orange));
  box-shadow:0 24px 80px rgba(0,0,0,.6),0 0 22px rgba(255,106,0,.13);
}
.clip-inner{
  width:100%;height:100%;
  overflow:hidden;
  border-radius:4px;
  background:#000;
  position:relative;
}
video{
  width:100%;height:100%;
  display:block;
  object-fit:contain;
  background:#000;
}
.loading{
  position:absolute;z-index:5;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:#050506;
  font-size:clamp(14px,1.1vw,20px);
  color:#aaaeb8;
}
.loading.hidden{display:none}
.problem{
  position:absolute;z-index:10;inset:0;
  display:none;align-items:center;justify-content:center;
  padding:35px;text-align:center;background:#090a0d;
}
.problem.show{display:flex}
.problem-box{
  max-width:700px;background:#15171c;border:1px solid rgba(255,255,255,.08);
  border-radius:16px;padding:32px;box-shadow:0 20px 60px rgba(0,0,0,.45);
}
.problem strong{display:block;font-size:26px;margin-bottom:10px}
.problem span{color:#c0c3ca;line-height:1.5}
</style>
</head>
<body>
<div class="screen">
  <section class="header">
    <h1 class="title">VUELVO ENSEGUIDA</h1>
    <div class="subtitle">¡NO TE VAYAS, VUELVO PRONTO!</div>
  </section>

  <section class="clip-frame">
    <div class="clip-inner">
      <video id="video" autoplay playsinline></video>
      <div class="loading" id="loading">Cargando clips…</div>
      <div class="problem" id="problem">
        <div class="problem-box">
          <strong>No se han podido cargar los clips</strong>
          <span id="problemText"></span>
        </div>
      </div>
    </div>
  </section>
</div>

<script>
const CHANNEL = "quemassteda";
const CLIENT_ID = "ksrqgve63aqdltq740gik0w1at8nyo";
const REQUIRED_SCOPE = "channel:manage:clips";
const TOKEN_KEY = "qst_meld_download_token_v2";
const STATE_KEY = "qst_oauth_state_v2";

const video = document.getElementById("video");
const loading = document.getElementById("loading");
const problem = document.getElementById("problem");
const problemText = document.getElementById("problemText");

let token = "";
let broadcasterId = "";
let clips = [];
let queue = [];
let pos = 0;
let changing = false;

function shuffle(a){
  a=[...a];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function randomState(){
  const a=new Uint32Array(4);
  crypto.getRandomValues(a);
  return Array.from(a,x=>x.toString(16)).join("");
}
function redirectUri(){
  return location.origin + location.pathname;
}
function clearCallbackUrl(){
  history.replaceState(null,"",location.pathname);
}
function parseToken(){
  const h=new URLSearchParams(location.hash.replace(/^#/,""));
  const t=h.get("access_token");
  const state=h.get("state");

  if(t){
    const expected=sessionStorage.getItem(STATE_KEY);
    if(expected && state!==expected){
      throw new Error("La autorización de Twitch no coincide con esta sesión.");
    }
    localStorage.setItem(TOKEN_KEY,t);
    sessionStorage.removeItem(STATE_KEY);
    clearCallbackUrl();
    return t;
  }

  const q=new URLSearchParams(location.search);
  if(q.get("error")){
    throw new Error(q.get("error_description") || q.get("error"));
  }
  return localStorage.getItem(TOKEN_KEY) || "";
}
function authorize(){
  const state=randomState();
  sessionStorage.setItem(STATE_KEY,state);

  const p=new URLSearchParams({
    response_type:"token",
    client_id:CLIENT_ID,
    redirect_uri:redirectUri(),
    scope:REQUIRED_SCOPE,
    state,
    force_verify:"false"
  });

  location.replace("https://id.twitch.tv/oauth2/authorize?"+p.toString());
}
async function validate(t){
  const r=await fetch("https://id.twitch.tv/oauth2/validate",{
    headers:{Authorization:"OAuth "+t}
  });
  if(!r.ok) return null;
  return await r.json();
}
function hasScope(info){
  return Array.isArray(info?.scopes) && info.scopes.includes(REQUIRED_SCOPE);
}
async function helix(path){
  const r=await fetch("https://api.twitch.tv/helix/"+path,{
    headers:{
      "Client-Id":CLIENT_ID,
      "Authorization":"Bearer "+token
    }
  });
  const j=await r.json();
  if(!r.ok) throw new Error(j.message || ("Twitch API HTTP "+r.status));
  return j;
}
async function getBroadcasterId(){
  const j=await helix("users?login="+encodeURIComponent(CHANNEL));
  if(!j.data?.length) throw new Error("No se encuentra el canal.");
  return j.data[0].id;
}
async function getClips(){
  const j=await helix(
    "clips?broadcaster_id="+encodeURIComponent(broadcasterId)+"&first=100"
  );
  if(!j.data?.length) throw new Error("Twitch no ha devuelto clips.");
  return j.data;
}
async function getDownloadUrl(clipId){
  const p=new URLSearchParams();
  p.set("broadcaster_id",broadcasterId);
  p.set("editor_id",broadcasterId);
  p.append("clip_id",clipId);

  const j=await helix("clips/downloads?"+p.toString());
  const row=j.data?.find(x=>x.clip_id===clipId) || j.data?.[0];
  if(!row?.landscape_download_url){
    throw new Error("Twitch no ha dado una URL de vídeo para este clip.");
  }
  return row.landscape_download_url;
}
async function playNext(){
  if(changing || !queue.length) return;
  changing=true;

  try{
    let lastError=null;

    for(let tries=0; tries<Math.min(10,queue.length); tries++){
      if(pos>=queue.length){
        queue=shuffle(clips);
        pos=0;
      }

      const clip=queue[pos++];

      try{
        const url=await getDownloadUrl(clip.id);
        video.src=url;
        video.load();
        video.muted=false;

        try{
          await video.play();
        }catch(e){
          // Algunos navegadores bloquean autoplay con audio.
          // MELD normalmente lo permite; si no, reproducimos el vídeo sin UI.
          video.muted=true;
          await video.play();
        }

        loading.classList.add("hidden");
        changing=false;
        return;
      }catch(e){
        lastError=e;
        console.warn("Clip omitido",clip.id,e);
      }
    }

    throw lastError || new Error("No se ha podido reproducir ningún clip.");
  }catch(e){
    fail(e);
  }finally{
    changing=false;
  }
}
function fail(e){
  console.error(e);
  loading.classList.add("hidden");
  problem.classList.add("show");
  problemText.textContent=String(e?.message || e);
}
video.addEventListener("ended",playNext);
video.addEventListener("error",()=>{
  console.warn("Error de vídeo",video.error);
  setTimeout(playNext,500);
});

(async()=>{
  try{
    token=parseToken();

    if(!token){
      authorize();
      return;
    }

    const info=await validate(token);

    if(!info || info.client_id!==CLIENT_ID || !hasScope(info)){
      localStorage.removeItem(TOKEN_KEY);
      authorize();
      return;
    }

    broadcasterId=await getBroadcasterId();

    // El token debe pertenecer al propio canal para descargar sus clips.
    if(info.user_id && info.user_id!==broadcasterId){
      localStorage.removeItem(TOKEN_KEY);
      throw new Error("Autoriza Twitch con la cuenta del canal quemassteda.");
    }

    clips=await getClips();
    queue=shuffle(clips);
    await playNext();

  }catch(e){
    fail(e);
  }
})();
</script>
</body>
</html>
