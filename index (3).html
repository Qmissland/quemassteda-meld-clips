<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vuelvo enseguida</title>
<style>
:root{
  --bg:#090a0d;
  --panel:#17191e;
  --orange:#ff6a00;
  --orange2:#ff922f;
}
*{box-sizing:border-box}
html,body{
  width:100%;height:100%;margin:0;overflow:hidden;
  background:var(--bg);color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}
body{
  background:
    radial-gradient(circle at 50% 28%,rgba(255,106,0,.045),transparent 38%),
    linear-gradient(180deg,#0b0c10,#08090b);
}
body:before,body:after{
  content:"";position:fixed;inset:-25%;pointer-events:none;
}
body:before{
  opacity:.65;
  background:
    linear-gradient(110deg,transparent 0 47%,rgba(255,106,0,.08) 47.25% 47.65%,transparent 47.9%),
    linear-gradient(290deg,transparent 0 58%,rgba(255,106,0,.04) 58.25% 58.55%,transparent 58.8%);
  animation:bgmove 22s linear infinite;
}
body:after{
  opacity:.35;
  background:linear-gradient(68deg,transparent 0 49%,rgba(255,106,0,.08) 49.25% 49.5%,transparent 49.8%);
  animation:bgmove2 29s linear infinite;
}
@keyframes bgmove{to{transform:translate3d(5%,-3%,0)}}
@keyframes bgmove2{to{transform:translate3d(-4%,3%,0)}}

.screen{
  width:100vw;height:100vh;
  padding:4vh 5.2vw 5vh;
  display:flex;flex-direction:column;align-items:center;
  gap:2.4vh;
}

/* CABECERA COMO EN TU VIDEO */
.header{
  width:min(1180px,82vw);
  min-height:14.5vh;
  border:1px solid rgba(255,255,255,.09);
  border-radius:5px;
  background:linear-gradient(180deg,#1a1c21,#111318);
  box-shadow:0 18px 60px rgba(0,0,0,.38);
  position:relative;
  display:flex;flex-direction:column;
  justify-content:center;align-items:center;
  padding:1.5vh 3vw 1.2vh;
}
.header:before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  background:linear-gradient(var(--orange2),var(--orange));
  box-shadow:0 0 20px rgba(255,106,0,.25);
}
.header:after{
  content:"";position:absolute;left:0;bottom:-1px;width:18%;height:2px;
  background:var(--orange);
}
.title{
  margin:0;
  font-size:clamp(48px,5.35vw,104px);
  line-height:.93;font-weight:950;letter-spacing:-.04em;
  text-transform:uppercase;text-align:center;
}
.subtitle{
  margin-top:.7vh;
  font-size:clamp(13px,1.15vw,23px);
  font-weight:800;color:#e1e2e6;
  text-transform:uppercase;text-align:center;
}

/* MARCO DEL CLIP */
.clip-frame{
  flex:1;min-height:0;
  width:min(1280px,88vw);
  position:relative;
  padding:3px;
  border-radius:6px;
  background:linear-gradient(
    135deg,
    var(--orange),
    rgba(255,106,0,.25) 35%,
    rgba(255,255,255,.16) 60%,
    var(--orange)
  );
  box-shadow:
    0 24px 80px rgba(0,0,0,.6),
    0 0 22px rgba(255,106,0,.13);
}

/*
  EL TRUCO:
  Twitch sigue funcionando con su iframe oficial,
  pero el iframe es bastante mas grande que la ventana visible.
  La UI de Twitch queda fuera del recorte.
*/
.clip-window{
  width:100%;height:100%;
  position:relative;
  overflow:hidden;
  border-radius:4px;
  background:#000;
}

#player{
  position:absolute;
  border:0;
  background:#000;

  /* ancho extra para sacar tambien los elementos laterales */
  width:106%;
  left:-3%;

  /*
    Altura extra + desplazamiento.
    Esto empuja fuera de la ventana la franja superior
    y, sobre todo, la barra/titulo inferior de Twitch.
  */
  height:134%;
  top:-16.5%;

  /* evita hover, controles y overlays activados por el raton */
  pointer-events:none;
}

/* una pequeña mascara de seguridad en los extremos */
.clip-window:before,
.clip-window:after{
  content:"";
  position:absolute;
  z-index:5;
  left:0;right:0;
  height:1.5%;
  background:#000;
  pointer-events:none;
}
.clip-window:before{top:0}
.clip-window:after{bottom:0}

.loading{
  position:absolute;z-index:10;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:#050506;color:#aaaeb8;
  font-size:18px;
}
.loading.hidden{display:none}

.problem{
  position:absolute;z-index:20;inset:0;
  display:none;align-items:center;justify-content:center;
  padding:35px;text-align:center;background:#090a0d;
}
.problem.show{display:flex}
.problem-box{
  max-width:700px;background:#15171c;
  border:1px solid rgba(255,255,255,.08);
  border-radius:16px;padding:32px;
}
.problem strong{display:block;font-size:26px;margin-bottom:10px}
.problem span{color:#c0c3ca;line-height:1.5}
</style>
</head>
<body>

<div class="screen">
  <section class="header">
    <h1 class="title">VUELVO ENSEGUIDA</h1>
    <div class="subtitle">¡NO TE VAYAS, VUELVO PRONTO!</div>
  </section>

  <section class="clip-frame">
    <div class="clip-window">
      <iframe
        id="player"
        allow="autoplay; fullscreen"
        allowfullscreen>
      </iframe>

      <div class="loading" id="loading">Cargando clips…</div>

      <div class="problem" id="problem">
        <div class="problem-box">
          <strong>No se han podido cargar los clips</strong>
          <span id="problemText"></span>
        </div>
      </div>
    </div>
  </section>
</div>

<script>
const CHANNEL = "quemassteda";
const CLIENT_ID = "ksrqgve63aqdltq740gik0w1at8nyo";

const TOKEN_KEY = "qst_meld_oauth_token";
const STATE_KEY = "qst_meld_oauth_state";

const player = document.getElementById("player");
const loading = document.getElementById("loading");
const problem = document.getElementById("problem");
const problemText = document.getElementById("problemText");

let clips = [];
let queue = [];
let pos = 0;
let timer = null;

function shuffle(a){
  a=[...a];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function randomState(){
  const a=new Uint32Array(4);
  crypto.getRandomValues(a);
  return Array.from(a,x=>x.toString(16)).join("");
}

function redirectUri(){
  return location.origin + location.pathname;
}

function cleanUrl(){
  history.replaceState(null,"",location.pathname);
}

function readToken(){
  const h=new URLSearchParams(location.hash.replace(/^#/,""));
  const access=h.get("access_token");
  const state=h.get("state");

  if(access){
    const expected=sessionStorage.getItem(STATE_KEY);
    if(expected && state!==expected){
      throw new Error("La autorización de Twitch no coincide con esta sesión.");
    }

    localStorage.setItem(TOKEN_KEY,access);
    sessionStorage.removeItem(STATE_KEY);
    cleanUrl();
    return access;
  }

  const q=new URLSearchParams(location.search);
  if(q.get("error")){
    throw new Error(q.get("error_description") || q.get("error"));
  }

  return localStorage.getItem(TOKEN_KEY) || "";
}

function authorize(){
  const state=randomState();
  sessionStorage.setItem(STATE_KEY,state);

  const p=new URLSearchParams({
    response_type:"token",
    client_id:CLIENT_ID,
    redirect_uri:redirectUri(),
    scope:"",
    state
  });

  location.href="https://id.twitch.tv/oauth2/authorize?"+p.toString();
}

async function validateToken(token){
  const r=await fetch("https://id.twitch.tv/oauth2/validate",{
    headers:{Authorization:"OAuth "+token}
  });

  if(!r.ok) return false;

  const j=await r.json();
  return j.client_id===CLIENT_ID;
}

async function helix(path,token){
  const r=await fetch("https://api.twitch.tv/helix/"+path,{
    headers:{
      "Client-Id":CLIENT_ID,
      "Authorization":"Bearer "+token
    }
  });

  const j=await r.json();

  if(!r.ok){
    throw new Error(j.message || ("Twitch API HTTP "+r.status));
  }

  return j;
}

async function getChannelId(token){
  const j=await helix(
    "users?login="+encodeURIComponent(CHANNEL),
    token
  );

  if(!j.data?.length){
    throw new Error("No encuentro el canal "+CHANNEL+".");
  }

  return j.data[0].id;
}

async function getClips(token,id){
  const j=await helix(
    "clips?broadcaster_id="+encodeURIComponent(id)+"&first=100",
    token
  );

  if(!j.data?.length){
    throw new Error("Twitch no ha devuelto clips.");
  }

  return j.data;
}

function embedUrl(clip){
  const p=new URLSearchParams({
    clip:clip.id,
    parent:location.hostname,
    autoplay:"true",
    muted:"false"
  });

  return "https://clips.twitch.tv/embed?"+p.toString();
}

function playNext(){
  clearTimeout(timer);

  if(!queue.length) return;

  if(pos>=queue.length){
    queue=shuffle(clips);
    pos=0;
  }

  const clip=queue[pos++];

  player.src=embedUrl(clip);

  /*
    Usamos la duracion que Twitch devuelve para cambiar
    de clip automaticamente. Nada de controles visibles.
  */
  const seconds=Math.max(4,Number(clip.duration||15));

  timer=setTimeout(
    playNext,
    (seconds+1.4)*1000
  );
}

function fail(e){
  console.error(e);
  loading.classList.add("hidden");
  problem.classList.add("show");
  problemText.textContent=String(e?.message || e);
}

(async()=>{
  try{
    let token=readToken();

    if(!token){
      authorize();
      return;
    }

    const valid=await validateToken(token);

    if(!valid){
      localStorage.removeItem(TOKEN_KEY);
      authorize();
      return;
    }

    const channelId=await getChannelId(token);
    clips=await getClips(token,channelId);
    queue=shuffle(clips);

    loading.classList.add("hidden");
    playNext();

  }catch(e){
    fail(e);
  }
})();
</script>
</body>
</html>
