<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vuelvo enseguida</title>
<style>
:root{
  --bg:#090a0d;
  --panel:#17191e;
  --orange:#ff6a00;
  --orange2:#ff922f;
}
*{box-sizing:border-box}
html,body{
  width:100%;height:100%;margin:0;overflow:hidden;
  background:var(--bg);color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}
body{
  background:
    radial-gradient(circle at 50% 30%,rgba(255,106,0,.045),transparent 38%),
    linear-gradient(180deg,#0b0c10,#08090b);
}
body:before,body:after{
  content:"";position:fixed;inset:-25%;pointer-events:none;
}
body:before{
  opacity:.65;
  background:
    linear-gradient(110deg,transparent 0 47%,rgba(255,106,0,.08) 47.25% 47.65%,transparent 47.9%),
    linear-gradient(290deg,transparent 0 58%,rgba(255,106,0,.04) 58.25% 58.55%,transparent 58.8%);
  animation:bgmove 22s linear infinite;
}
body:after{
  opacity:.35;
  background:linear-gradient(68deg,transparent 0 49%,rgba(255,106,0,.08) 49.25% 49.5%,transparent 49.8%);
  animation:bgmove2 29s linear infinite;
}
@keyframes bgmove{to{transform:translate3d(5%,-3%,0)}}
@keyframes bgmove2{to{transform:translate3d(-4%,3%,0)}}

.screen{
  height:100vh;width:100vw;
  padding:4vh 5.2vw 5vh;
  display:flex;flex-direction:column;align-items:center;gap:2.4vh;
}
.header{
  width:min(1180px,82vw);
  min-height:14.5vh;
  border:1px solid rgba(255,255,255,.09);
  border-radius:5px;
  background:linear-gradient(180deg,#1a1c21,#111318);
  box-shadow:0 18px 60px rgba(0,0,0,.38);
  position:relative;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:1.5vh 3vw 1.2vh;
}
.header:before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  background:linear-gradient(var(--orange2),var(--orange));
}
.header:after{
  content:"";position:absolute;left:0;bottom:-1px;width:18%;height:2px;background:var(--orange);
}
.title{
  margin:0;font-size:clamp(48px,5.35vw,104px);line-height:.93;
  font-weight:950;letter-spacing:-.04em;text-transform:uppercase;text-align:center;
}
.subtitle{
  margin-top:.7vh;font-size:clamp(13px,1.15vw,23px);font-weight:800;
  color:#e1e2e6;text-transform:uppercase;text-align:center;
}
.clip-frame{
  flex:1;min-height:0;width:min(1280px,88vw);
  position:relative;padding:3px;border-radius:6px;
  background:linear-gradient(135deg,var(--orange),rgba(255,106,0,.25) 35%,rgba(255,255,255,.16) 60%,var(--orange));
  box-shadow:0 24px 80px rgba(0,0,0,.6),0 0 22px rgba(255,106,0,.13);
}
.clip-inner{
  width:100%;height:100%;overflow:hidden;border-radius:4px;
  background:#000;position:relative;
}

/* Solo vídeo. Sin iframe, sin controls, sin UI de Twitch. */
video{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:contain;
  background:#000;
  opacity:0;
  transition:opacity .25s ease;
}
video.active{opacity:1}

.loading{
  position:absolute;z-index:10;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:#050506;color:#aaaeb8;font-size:18px;
}
.loading.hidden{display:none}

.problem{
  position:absolute;z-index:20;inset:0;
  display:none;align-items:center;justify-content:center;
  padding:35px;text-align:center;background:#090a0d;
}
.problem.show{display:flex}
.problem-box{
  max-width:700px;background:#15171c;
  border:1px solid rgba(255,255,255,.08);
  border-radius:16px;padding:32px;
}
.problem strong{display:block;font-size:26px;margin-bottom:10px}
.problem span{color:#c0c3ca;line-height:1.5}
</style>
</head>
<body>

<div class="screen">
  <section class="header">
    <h1 class="title">VUELVO ENSEGUIDA</h1>
    <div class="subtitle">¡NO TE VAYAS, VUELVO PRONTO!</div>
  </section>

  <section class="clip-frame">
    <div class="clip-inner">
      <video id="videoA" autoplay playsinline></video>
      <video id="videoB" autoplay playsinline></video>

      <div class="loading" id="loading">Cargando clips…</div>

      <div class="problem" id="problem">
        <div class="problem-box">
          <strong>No se han podido cargar los clips</strong>
          <span id="problemText"></span>
        </div>
      </div>
    </div>
  </section>
</div>

<script>
const CHANNEL = "quemassteda";
const CLIENT_ID = "ksrqgve63aqdltq740gik0w1at8nyo";
const REDIRECT_URI = location.origin + location.pathname;

const TOKEN_KEY = "qst_twitch_token_clean_v1";
const STATE_KEY = "qst_twitch_state_clean_v1";

/* Client ID del cliente web de Twitch usado para resolver el MP4 firmado. */
const TWITCH_WEB_CLIENT_ID = "kimne78kx3ncx6brgo4mv6wki5h1ko";

/* Consulta actualmente usada por overlays compatibles. */
const ACCESS_HASHES = [
  "36b89d2507fce29e5ca551df756d27c1cfe079e2609642b4390aa4c35796eb11",
  "993d9a5131f15a37bd16f32342c44ed1e0b1a9b968c6afdb662d2cddd595f6c5"
];

const vidA = document.getElementById("videoA");
const vidB = document.getElementById("videoB");
const loading = document.getElementById("loading");
const problem = document.getElementById("problem");
const problemText = document.getElementById("problemText");

let accessToken = "";
let clips = [];
let current = -1;
let activeSlot = "a";
let switching = false;

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function randomState(){
  const a=new Uint32Array(4);
  crypto.getRandomValues(a);
  return Array.from(a,x=>x.toString(16)).join("");
}

function handleOAuthCallback(){
  const hash=location.hash.slice(1);
  if(!hash) return localStorage.getItem(TOKEN_KEY) || "";

  const p=new URLSearchParams(hash);

  if(p.get("error")){
    throw new Error(p.get("error_description") || p.get("error"));
  }

  const token=p.get("access_token");
  if(!token) return localStorage.getItem(TOKEN_KEY) || "";

  const expected=sessionStorage.getItem(STATE_KEY);
  const got=p.get("state");

  if(expected && expected!==got){
    throw new Error("La respuesta de Twitch no coincide con esta sesión.");
  }

  localStorage.setItem(TOKEN_KEY,token);
  sessionStorage.removeItem(STATE_KEY);
  history.replaceState(null,"",location.pathname);
  return token;
}

function twitchLogin(){
  const state=randomState();
  sessionStorage.setItem(STATE_KEY,state);

  const url=new URL("https://id.twitch.tv/oauth2/authorize");
  url.searchParams.set("client_id",CLIENT_ID);
  url.searchParams.set("redirect_uri",REDIRECT_URI);
  url.searchParams.set("response_type","token");
  url.searchParams.set("scope","clips:edit");
  url.searchParams.set("state",state);

  location.href=url.toString();
}

async function validateToken(){
  try{
    const r=await fetch("https://id.twitch.tv/oauth2/validate",{
      headers:{Authorization:`OAuth ${accessToken}`}
    });
    if(!r.ok) return false;
    const j=await r.json();
    return j.client_id===CLIENT_ID;
  }catch{
    return false;
  }
}

async function helix(path){
  const r=await fetch("https://api.twitch.tv/helix/"+path,{
    headers:{
      Authorization:`Bearer ${accessToken}`,
      "Client-Id":CLIENT_ID
    }
  });

  const j=await r.json();

  if(!r.ok){
    throw new Error(j.message || `Twitch API HTTP ${r.status}`);
  }

  return j;
}

async function fetchClips(){
  const userData=await helix("users?login="+encodeURIComponent(CHANNEL));
  const user=userData.data?.[0];

  if(!user) throw new Error("No encuentro el canal "+CHANNEL+".");

  const ago30=new Date(Date.now()-30*24*60*60*1000).toISOString();

  const headers={
    Authorization:`Bearer ${accessToken}`,
    "Client-Id":CLIENT_ID
  };

  const [topRes,recentRes]=await Promise.all([
    fetch(`https://api.twitch.tv/helix/clips?broadcaster_id=${user.id}&first=50`,{headers}),
    fetch(`https://api.twitch.tv/helix/clips?broadcaster_id=${user.id}&first=50&started_at=${encodeURIComponent(ago30)}`,{headers})
  ]);

  if(!topRes.ok || !recentRes.ok){
    throw new Error("Twitch no ha podido devolver la lista de clips.");
  }

  const top=await topRes.json();
  const recent=await recentRes.json();

  const seen=new Set();
  const all=[...(top.data||[]),...(recent.data||[])];

  clips=shuffle(all.filter(c=>{
    if(seen.has(c.id)) return false;
    seen.add(c.id);
    return true;
  }));

  if(!clips.length){
    throw new Error("No hay clips disponibles.");
  }
}

async function resolveClipMp4(clipId){
  let lastError=null;

  for(const hash of ACCESS_HASHES){
    try{
      const payload={
        operationName:"VideoAccessToken_Clip",
        variables:{slug:clipId},
        extensions:{
          persistedQuery:{
            version:1,
            sha256Hash:hash
          }
        }
      };

      const r=await fetch("https://gql.twitch.tv/gql",{
        method:"POST",
        headers:{
          "Client-Id":TWITCH_WEB_CLIENT_ID,
          "Content-Type":"application/json",
          "Authorization":`OAuth ${accessToken}`
        },
        body:JSON.stringify(payload)
      });

      if(!r.ok){
        lastError=new Error(`Twitch GQL HTTP ${r.status}`);
        continue;
      }

      const j=await r.json();
      const clip=j?.data?.clip;

      if(!clip?.playbackAccessToken || !clip?.videoQualities?.length){
        lastError=new Error("Twitch no devolvió vídeo para ese clip.");
        continue;
      }

      const {signature,value}=clip.playbackAccessToken;

      const qualities=[...clip.videoQualities]
        .filter(q=>q?.sourceURL)
        .sort((a,b)=>(parseInt(b.quality)||0)-(parseInt(a.quality)||0));

      const source=qualities[0]?.sourceURL;
      if(!source){
        lastError=new Error("El clip no tiene una calidad reproducible.");
        continue;
      }

      const sep=source.includes("?")?"&":"?";
      return `${source}${sep}sig=${encodeURIComponent(signature)}&token=${encodeURIComponent(value)}`;

    }catch(e){
      lastError=e;
    }
  }

  throw lastError || new Error("No se pudo resolver el MP4 del clip.");
}

function pickNextIndex(){
  if(clips.length===1) return 0;
  let n;
  do{
    n=Math.floor(Math.random()*clips.length);
  }while(n===current);
  return n;
}

async function playClip(index){
  if(switching || !clips.length) return;
  switching=true;

  try{
    let tries=0;
    let idx=index;

    while(tries<Math.min(8,clips.length)){
      const clip=clips[idx];

      try{
        if(!clip.mp4){
          clip.mp4=await resolveClipMp4(clip.id);
        }

        const nextVid=activeSlot==="a" ? vidB : vidA;
        const prevVid=activeSlot==="a" ? vidA : vidB;

        nextVid.src=clip.mp4;
        nextVid.load();
        nextVid.muted=true;

        await new Promise((resolve,reject)=>{
          const ok=()=>{
            cleanup();
            resolve();
          };
          const bad=()=>{
            cleanup();
            reject(new Error("El archivo de vídeo no se pudo cargar."));
          };
          const cleanup=()=>{
            nextVid.removeEventListener("canplay",ok);
            nextVid.removeEventListener("error",bad);
          };
          nextVid.addEventListener("canplay",ok,{once:true});
          nextVid.addEventListener("error",bad,{once:true});
        });

        await nextVid.play();

        /* Intento de audio; si MELD bloquea autoplay con audio, el vídeo sigue funcionando. */
        try{ nextVid.muted=false; }catch{}

        nextVid.classList.add("active");
        prevVid.classList.remove("active");

        activeSlot=activeSlot==="a" ? "b" : "a";
        current=idx;

        loading.classList.add("hidden");

        const upcoming=pickNextIndex();
        if(!clips[upcoming].mp4){
          resolveClipMp4(clips[upcoming].id)
            .then(url=>clips[upcoming].mp4=url)
            .catch(()=>{});
        }

        switching=false;
        return;

      }catch(e){
        console.warn("Clip omitido",clip.id,e);
        clip.mp4=null;
        idx=pickNextIndex();
        tries++;
      }
    }

    throw new Error("Twitch no ha podido reproducir ninguno de los clips probados.");

  }catch(e){
    fail(e);
  }finally{
    switching=false;
  }
}

function nextClip(){
  if(!clips.length) return;
  playClip(pickNextIndex());
}

vidA.addEventListener("ended",nextClip);
vidB.addEventListener("ended",nextClip);

function fail(e){
  console.error(e);
  loading.classList.add("hidden");
  problem.classList.add("show");
  problemText.textContent=String(e?.message || e);
}

(async()=>{
  try{
    accessToken=handleOAuthCallback();

    if(!accessToken){
      twitchLogin();
      return;
    }

    const valid=await validateToken();

    if(!valid){
      localStorage.removeItem(TOKEN_KEY);
      twitchLogin();
      return;
    }

    await fetchClips();

    /* Primero resolvemos uno. Si Twitch acepta la petición, arrancamos. */
    const first=0;
    clips[first].mp4=await resolveClipMp4(clips[first].id);

    await playClip(first);

  }catch(e){
    fail(e);
  }
})();
</script>
</body>
</html>
